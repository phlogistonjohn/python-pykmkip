
[server]
hostname=0.0.0.0
port=5696

certificate_path=/etc/kmip/tls/kmip.crt
key_path=/etc/kmip/tls/kmip.key
ca_path=/etc/kmip/tls/ca.crt

auth_suite=TLS1.2
policy_path=/var/lib/kmip/policy
logging_level=DEBUG
database_path=/var/lib/kmip/pykmip.db


